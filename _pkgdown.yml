url: https://thiago-cav.github.io/ZonationR/

template:
  bootstrap: 5
  theme: gruvbox-dark       # dark syntax highlight for code blocks
  bslib:
    bg: "#1E1E1E"           # page background dark
    fg: "#D4D4D4"           # main text color (light gray)
    primary: "#3CCF4E"      # links in green
    code-bg: "#2D2D2D"      # code block background
    code-color: "#C5E478"   # inline code color
    navbar-dark-bg: "#111111"  # navbar dark background

reference:
  - title: Preflight
    desc: Initial checks such as verifying input files and confirming Zonation 5 executable availability.
    contents:
      - has_concept("preflight")

  - title: Preprocessing
    desc: Preparing input data and generating necessary configuration files.
    contents:
      - has_concept("preprocessing")

  - title: Execution
    desc: Running the prioritization analysis directly from R.
    contents:
      - has_concept("execution")

  - title: Postprocessing
    desc: Importing outputs for further analysis and interpretation.
    contents:
      - has_concept("postprocessing")


navbar:
  structure:
    left: [home, intro, functions, articles, news]
    right: [search, github]
  components:
    home:
      icon: fa-home
      href: index.html
      aria-label: "Home page"
    functions:
      text: "Functions"
      href: reference/index.html   # must include href
    articles:
      text: Articles
      menu:
        - text: "Variants workflow"
          href: articles/variants-workflow.html
        - text: "Zonation outputs"
          href: articles/zonation-outputs.html
        - text: "Why spatial prioritization"
          href: articles/why_spatial_prioritization.html
    news:
      text: News
      href: news/index.html
